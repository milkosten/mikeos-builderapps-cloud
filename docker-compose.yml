# mikeos-builderapps-cloud on 242 — the control plane behind builderapps-api.osmike.com.
#
# api + its OWN Postgres. The api mounts the host docker socket (it IS the deployer) and the
# workspaces dir at the SAME host path on both sides (so `docker compose -f <hostpath> build`
# streams the correct build context to the host daemon). Joins deploy_default so the shared
# Caddy reverse-proxies builderapps-api.osmike.com -> this container.
services:
  mikeos-builderapps-db:
    image: postgres:18
    container_name: mikeos-builderapps-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mikeos
      POSTGRES_PASSWORD: ${BUILDERAPPS_DB_PASSWORD:-mikeos_builderapps_local}
      POSTGRES_DB: mikeos_builderapps
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /data/builderapps/control-pg:/var/lib/postgresql/data
    networks: [deploy_default]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mikeos -d mikeos_builderapps"]
      interval: 10s
      timeout: 5s
      retries: 12

  mikeos-builderapps:
    build: .
    image: mikeos-builderapps:latest
    container_name: mikeos-builderapps
    restart: unless-stopped
    depends_on:
      mikeos-builderapps-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mikeos:${BUILDERAPPS_DB_PASSWORD:-mikeos_builderapps_local}@mikeos-builderapps-db:5432/mikeos_builderapps
      GITEA_URL: ${GITEA_URL:-https://gitea.osmike.com}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER}
      GITEA_ADMIN_TOKEN: ${GITEA_ADMIN_TOKEN}
      GITEA_ADMIN_PW: ${GITEA_ADMIN_PW}
      OLLAMA_GPU_URL: ${OLLAMA_GPU_URL:-ollama://mikeos:uB49VXwMDy7R2JE0H7mI@81.8.177.182:11443}
      # OpenRouter (Kimi) — AUTHORIZED for builderapps. Key lives in .env on the host only.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BUILDERAPPS_LLM_MODEL: ${BUILDERAPPS_LLM_MODEL:-moonshotai/kimi-k3}
      CHROME_POOL_URL: ${CHROME_POOL_URL:-https://chrome-pool.osmike.com}
      CHROME_POOL_USER: ${CHROME_POOL_USER:-mikeos}
      CHROME_POOL_PASS: ${CHROME_POOL_PASS:-uB49VXwMDy7R2JE0H7mI}
      MIKEOSCOMPUTERS_URL: ${MIKEOSCOMPUTERS_URL:-https://account.osmike.com}
      ACCOUNT_OSMIKE_ISSUER: ${ACCOUNT_OSMIKE_ISSUER:-https://account.osmike.com}
      SECRETS_KEY: ${SECRETS_KEY}
      PUBLIC_BASE: ${PUBLIC_BASE:-https://builderapps.osmike.com}
      SITES_BASE: ${SITES_BASE:-builderapps.osmike.com}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://builderapps.osmike.com}
      WORKSPACES_ROOT: /opt/builderapps/workspaces
      # every raw LLM response + tool transcript lands here BEFORE it is parsed,
      # so a rejected reply can never destroy 20 minutes of work (phase 27)
      ARTIFACTS_ROOT: /opt/builderapps/artifacts
      BUILDERAPPS_VOL_ROOT: /data/builderapps/vol
      DEPLOY_NETWORK: deploy_default
      # --- per-project AI assistants (phase 29) ------------------------------------
      # Where a beat container reaches the control plane: the internal container name on
      # the shared deploy network. No public hop, no TLS to terminate, nothing exposed.
      ASSISTANT_CONTROL_URL: http://mikeos-builderapps:8000
      ASSISTANT_WORKSPACES_ROOT: /opt/builderapps/assistants
      ASSISTANT_RUNTIME_CONTEXT: /opt/mikeos-builderapps-cloud/assistant-runtime
      # --- phase 30: the assistant that SHIPS CODE ---------------------------------
      # A coding beat runs a whole Pi session, then a docker build, then the health gate,
      # so the outer wall is minutes rather than seconds.
      ASSISTANT_BEAT_TIMEOUT_SEC: ${ASSISTANT_BEAT_TIMEOUT_SEC:-2400}
      # THE spend backstop. Pi has no step, turn or cost cap of its own, so the control
      # plane's LLM proxy stops answering once one beat has spent this much.
      ASSISTANT_BEAT_COST_CAP_USD: ${ASSISTANT_BEAT_COST_CAP_USD:-1.50}
      # --- phase 33: assistants that message and WAKE each other ---------------------
      # THE DAILY CEILING, per project. Mike's number, and a hard STOP rather than an alert:
      # at the limit no further beat starts from any trigger — schedule, DM wake, or the
      # owner's own button — and the owner is told once, in the thread they already read.
      # It became necessary with messaging: a clock and a button are self-limiting, two
      # assistants being conscientious at each other are not.
      PROJECT_DAILY_USD: ${PROJECT_DAILY_USD:-10}
      # How many replies deep one conversation may go before it is stopped, and how long a
      # message stays "the thing you are replying to". The window is what stops a runaway
      # evading the depth count by answering on a later beat — and what stops two colleagues
      # who talk regularly accumulating depth for ever until they cannot reach each other.
      ASSISTANT_MAX_CHAIN_DEPTH: ${ASSISTANT_MAX_CHAIN_DEPTH:-4}
      ASSISTANT_CHAIN_WINDOW_MIN: ${ASSISTANT_CHAIN_WINDOW_MIN:-120}
    # Docker's default 10s SIGTERM->SIGKILL window is shorter than uvicorn's graceful
    # shutdown, so the app was being killed before its lifespan shutdown could run and
    # RELEASE ownership of in-flight runs. With room to shut down cleanly, an interrupted run
    # is handed back explicitly rather than only being inferred dead afterwards.
    stop_grace_period: 30s
    volumes:
      # the deployer shells out `docker compose` against the HOST daemon
      - /var/run/docker.sock:/var/run/docker.sock
      # SAME path both sides so build contexts resolve on the host daemon
      - /opt/builderapps/workspaces:/opt/builderapps/workspaces
      # agentic codegen transcripts — same path both sides, like the workspaces
      - /opt/builderapps/artifacts:/opt/builderapps/artifacts
      # project data volumes (pgdata/redis) live here; created by the deployer
      - /data/builderapps/vol:/data/builderapps/vol
      # phase 29: each assistant's own cached git checkout. SAME path both sides, because the
      # control plane creates+chowns the dir and then bind-mounts it into the beat container
      # by HOST path — the daemon resolves `-v` against the host, not against us.
      - /opt/builderapps/assistants:/opt/builderapps/assistants
      # the assistant-runtime image's build context, so the control plane can build it on
      # first use instead of needing a manual step on the host. Read-only: it is source.
      - /opt/mikeos-builderapps-cloud/assistant-runtime:/opt/mikeos-builderapps-cloud/assistant-runtime:ro
    networks: [deploy_default]
    mem_limit: 1g
    cpus: 2

networks:
  deploy_default:
    external: true
